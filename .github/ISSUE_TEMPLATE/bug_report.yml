name: Bug report
description: A widget renders wrong, grades wrong, or breaks a note.
labels: [bug]
body:
  - type: textarea
    id: markdown
    attributes:
      label: Markdown
      description: The smallest callout that shows the problem, as written in the note.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: dropdown
    id: view
    attributes:
      label: View
      multiple: true
      options:
        - Reading view
        - Live Preview
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Quizcraft, Obsidian, and OS (desktop or mobile).
      placeholder: Quizcraft 1.0.0, Obsidian 1.9.12, macOS 15
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Lines starting with "Quizcraft:" from the developer console (Ctrl/Cmd+Shift+I), if any.
      render: text
