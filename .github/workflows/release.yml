name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        shell: bash
        run: '[[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches manifest and versions.json
        shell: bash
        run: |
          version=$(jq -r .version manifest.json)
          [[ "$version" == "$GITHUB_REF_NAME" ]] || { echo "manifest.json is $version, tag is $GITHUB_REF_NAME"; exit 1; }
          [[ "$(jq -r .version package.json)" == "$version" ]] || { echo "package.json version differs"; exit 1; }
          jq -e --arg v "$version" 'has($v)' versions.json > /dev/null || { echo "versions.json has no $version"; exit 1; }

      - name: Check
        run: bun run check

      - name: Check generated styles.css
        run: bun run check:styles

      - name: Build
        run: bun run build

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            --verify-tag \
            --title "Quizcraft $GITHUB_REF_NAME" \
            --generate-notes
